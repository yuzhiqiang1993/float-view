[versions]

#/**
#* Compile sdk version
#* 按照指定sdk版本进行编译  不影响实际运行  尽量写最新的，最好跟targetsdkversion版本保持一致
#*/
compileSdk = "34"

#/**
#* Min sdk version
#* App支持的最低版本 Android 6.0
#*/
minSdk = "23"

#/**
#* Target sdk version
#* 目标版本 启用该版本特性 主要做兼容处理 低于该版本的设备按照实际版本运行  高于该版本的设备按照该版本特性运行
#* 可以参考市场占有份额来定 https://www.appbrain.com/stats/top-android-sdk-versions
# Android 13
#*/
targetSdk = "33"
#AGP的版本
agp = "8.1.0"
material = "1.9.0"
#AndroidX
androidxAppcompat = "1.6.1"
androidxActivityKtx = "1.8.2"
androidxFragmentKtx = "1.6.2"
androidxCollectionKtx = "1.4.0"
androidxLifecycle = "2.7.0"
androidxVectordrawable = "1.1.0"
androidxConstraintlayout = "2.1.4"
androidxAnnotation = "1.7.1"
androidxMultidex = "2.0.1"
androidxCore = "1.12.0"
androidxCoreSplashscreen = "1.0.1"
androidxCoordinatorlayout = "1.2.0"
androidxSwiperefreshlayout = "1.1.0"
androidxRecyclerview = "1.3.2"
androidxViewpager2 = "1.1.0-beta02"
androidxExifinterface = "1.3.7"
androidxRoom = "2.6.1"
androidxWebkit = "1.8.0"

#kotlin
kotlin = "1.7.21"
kotlinBom = "1.7.21"
ksp = "1.9.0-1.0.13"
kotlinxCoroutines = "1.7.2"
kotlinxSerializationJson = "1.5.1"

#三方库
benManesVersion = "0.51.0"
vanniktechPublish = "0.25.3"
moshiKotlin = "1.15.1"
mmkv = "1.3.0"
jsoup = "1.17.2"
flexboxLayout = "3.0.0"
leakcanaryAndroid = "2.13"
coil = "2.6.0"
activity = "1.8.2"

junit = "4.13.2"
androidx-test-ext-junit = "1.1.5"
espresso-core = "3.5.1"

#高德map
gaodeLocation = "6.4.3"

#我的开源库
xeonBuildManager = "0.0.7"
xeonZxing = "2.2.9"
xeonCordovaWebContainer = "1.0.6"
xeonCordovaLib = "12.0.2"
xeonBsDiff = "1.0.4"
xeonLogger = "1.0.5"
xeonApplication = "1.0.6-SNAPSHOT"
xeonCoroutine = "1.0.3"
xeonMMKV = "1.0.0"
xeonBinding = "1.0.0"
xeonLocationManager = "1.0.1"
xeonLocationGaode = "1.0.1"
xeonLocationTencent = "1.0.1"
xeonLocationBaidu = "1.0.1"
xeonNetworkStatus = "1.0.1"



[libraries]
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
#androidX
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivityKtx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragmentKtx" }
